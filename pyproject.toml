[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Hinglish voice receptionist for Indian clinics, built on LiveKit Agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[cartesia,deepgram,google,sarvam,silero]~=1.8",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
